<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>冰櫃醫生 AI 客服</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: 'Noto Sans TC', sans-serif;
  background: #F5F7FA;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

header {
  background: #fff;
  border-bottom: 1px solid #E5E7EB;
  padding: 0 24px;
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo { display:flex; align-items:center; gap:10px; }
.logo-name { font-size:16px; font-weight:700; color:#111827; }
.logo-sub { font-size:11px; color:#6B7280; }

.online { display:flex; align-items:center; gap:6px; font-size:12px; color:#6B7280; }
.online-dot { width:7px; height:7px; background:#10B981; border-radius:50%; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

.container {
  flex:1;
  display:flex;
  max-width: 960px;
  width:100%;
  margin: 24px auto;
  gap: 20px;
  padding: 0 20px;
  overflow: hidden;
}

.sidebar {
  width: 220px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.card {
  background: #fff;
  border: 1px solid #E5E7EB;
  border-radius: 12px;
  padding: 16px;
}

.card-title {
  font-size: 11px; font-weight: 600;
  color: #9CA3AF; letter-spacing: 1px;
  text-transform: uppercase; margin-bottom: 10px;
}

.qbtn {
  display:flex; align-items:center; gap:8px;
  width:100%; text-align:left;
  background:none; border:none;
  padding: 8px 6px; border-radius: 8px;
  font-size: 13px; color: #374151;
  cursor:pointer; font-family:'Noto Sans TC',sans-serif;
  transition: background .15s; margin-bottom:2px;
}
.qbtn:hover { background: #F3F4F6; }

.test-row {
  display:flex; justify-content:space-between;
  padding: 5px 0; border-bottom: 1px solid #F3F4F6;
  font-size:12px; color:#6B7280;
}
.test-row:last-of-type { border-bottom:none; }
.test-val { color:#1D4ED8; font-weight:500; }
.test-note { font-size:11px; color:#9CA3AF; margin-top:8px; line-height:1.5; }

.chat {
  flex:1; background:#fff;
  border: 1px solid #E5E7EB; border-radius:12px;
  display:flex; flex-direction:column; overflow:hidden;
}

.chat-head {
  padding: 14px 18px; border-bottom: 1px solid #F3F4F6;
  display:flex; align-items:center; gap:10px;
}

.agent-icon {
  width:36px; height:36px;
  background: linear-gradient(135deg, #3B82F6, #1D4ED8);
  border-radius:10px; display:flex; align-items:center;
  justify-content:center; font-size:18px;
}

.agent-name { font-size:14px; font-weight:600; color:#111827; }
.agent-sub { font-size:11px; color:#9CA3AF; margin-top:1px; }

.messages {
  flex:1; overflow-y:auto; padding:20px 18px;
  display:flex; flex-direction:column; gap:14px;
  scroll-behavior:smooth;
}
.messages::-webkit-scrollbar { width:3px; }
.messages::-webkit-scrollbar-thumb { background:#E5E7EB; border-radius:2px; }

.welcome { text-align:center; padding:32px 16px; }
.welcome-icon { font-size:40px; margin-bottom:12px; }
.welcome h3 { font-size:17px; font-weight:700; color:#111827; margin-bottom:6px; }
.welcome p { font-size:13px; color:#6B7280; line-height:1.6; margin-bottom:16px; }
.chips { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; }
.chip {
  background:#F3F4F6; border:none;
  padding:6px 12px; border-radius:16px;
  font-size:12px; color:#374151;
  cursor:pointer; font-family:'Noto Sans TC',sans-serif;
  transition:background .15s;
}
.chip:hover { background:#E5E7EB; }

.msg { display:flex; gap:8px; animation: up .25s ease; }
@keyframes up { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
.msg.user { flex-direction:row-reverse; }

.ava {
  width:28px; height:28px; border-radius:8px;
  display:flex; align-items:center; justify-content:center;
  font-size:13px; flex-shrink:0; margin-top:2px;
}
.msg.bot .ava { background:linear-gradient(135deg,#3B82F6,#1D4ED8); }
.msg.user .ava {
  background:#F3F4F6; border:1px solid #E5E7EB;
  font-size:10px; font-weight:600; color:#6B7280;
}

.bubble { max-width:74%; padding:10px 14px; border-radius:12px; font-size:13.5px; line-height:1.7; }
.msg.bot .bubble { background:#F9FAFB; border:1px solid #E5E7EB; border-top-left-radius:3px; color:#111827; }
.msg.user .bubble { background:#2563EB; color:#fff; border-top-right-radius:3px; }

.msg-time { font-size:10px; color:#D1D5DB; margin-top:4px; }
.msg.user .msg-time { text-align:right; }

.typing { display:flex; gap:8px; animation:up .25s ease; }
.typing-bubble {
  background:#F9FAFB; border:1px solid #E5E7EB;
  padding:12px 14px; border-radius:12px; border-top-left-radius:3px;
  display:flex; gap:4px; align-items:center;
}
.td { width:6px; height:6px; background:#3B82F6; border-radius:50%; animation:td 1.4s infinite; }
.td:nth-child(2){animation-delay:.2s} .td:nth-child(3){animation-delay:.4s}
@keyframes td{0%,60%,100%{transform:translateY(0);opacity:.3}30%{transform:translateY(-5px);opacity:1}}

.input-area { padding:12px 18px; border-top:1px solid #F3F4F6; }

.input-row { display:flex; gap:8px; align-items:flex-end; }

textarea {
  flex:1; border:1px solid #E5E7EB; border-radius:10px;
  padding:10px 14px; font-size:13.5px;
  font-family:'Noto Sans TC',sans-serif;
  color:#111827; resize:none; outline:none;
  min-height:42px; max-height:100px; line-height:1.5;
  transition:border-color .2s;
}
textarea:focus { border-color:#3B82F6; }
textarea::placeholder { color:#9CA3AF; }

.send {
  width:42px; height:42px; background:#2563EB;
  border:none; border-radius:10px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0; transition:background .2s;
}
.send:hover { background:#1D4ED8; }
.send:disabled { background:#E5E7EB; cursor:not-allowed; }
.send svg { width:17px; height:17px; fill:#fff; }

.hint { font-size:11px; color:#D1D5DB; text-align:center; margin-top:6px; }
</style>
</head>
<body>

<header>
  <div class="logo">
    <span style="font-size:22px">🧊</span>
    <div>
      <div class="logo-name">冰櫃醫生</div>
      <div class="logo-sub">AI 智能客服系統</div>
    </div>
  </div>
  <div class="online">
    <div class="online-dot"></div>
    AI 客服上線中
  </div>
</header>

<div class="container">
  <div class="sidebar">
    <div class="card">
      <div class="card-title">快速提問</div>
      <button class="qbtn" onclick="q('你們提供哪些維修服務？')">🔧 維修服務</button>
      <button class="qbtn" onclick="q('設備銷售有哪些選擇？')">🛒 設備銷售</button>
      <button class="qbtn" onclick="q('我要查詢訂單狀態')">📦 查詢訂單</button>
      <button class="qbtn" onclick="q('維修費用怎麼計算？')">💰 費用說明</button>
      <button class="qbtn" onclick="q('冰櫃不製冷怎麼辦？')">❄️ 緊急故障</button>
    </div>

    <div class="card">
      <div class="card-title">測試帳號</div>
      <div class="test-row"><span>訂單號</span><span class="test-val">ORD-2024-001</span></div>
      <div class="test-row"><span>電話</span><span class="test-val">0912345678</span></div>
      <p class="test-note">輸入以上資料可測試訂單自動查詢功能</p>
    </div>
  </div>

  <div class="chat">
    <div class="chat-head">
      <div class="agent-icon">🤖</div>
      <div>
        <div class="agent-name">冰櫃醫生 AI 客服</div>
        <div class="agent-sub">全台冷凍冷藏設備 · 維修 · 銷售 · 訂單查詢</div>
      </div>
    </div>

    <div class="messages" id="msgs">
      <div class="welcome">
        <div class="welcome-icon">🧊</div>
        <h3>您好，歡迎光臨冰櫃醫生</h3>
        <p>請問有什麼可以協助您的地方？<br>維修、銷售、訂單查詢，歡迎隨時告知。</p>
        <div class="chips">
          <button class="chip" onclick="q('你們提供哪些服務？')">服務項目</button>
          <button class="chip" onclick="q('我要查訂單')">查詢訂單</button>
          <button class="chip" onclick="q('維修費用多少？')">費用說明</button>
          <button class="chip" onclick="q('冰櫃不製冷怎麼辦？')">緊急故障</button>
        </div>
      </div>
    </div>

    <div class="input-area">
      <div class="input-row">
        <textarea id="inp" placeholder="輸入您的問題..." rows="1"
          onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"
          oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,100)+'px'"></textarea>
        <button class="send" id="sendBtn" onclick="send()">
          <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
      <div class="hint">Enter 發送 · Shift+Enter 換行</div>
    </div>
  </div>
</div>

<script>
const KEY='AIzaSyB_Hoj-AHLMH-ruEFFqbNitkD6q1_teq5I';
let hist=[],busy=false;
const SID='1fv3t7I6CNJlMlWBtoPJ9-gzEvG99KH_5y2OkHjecSn8';
const GK='AIzaSyA7-uPK4tZeXWKo0dn2_9AYR91d9gKI03c';
const SYS=`你是「冰櫃醫生」的專業客服助理。冰櫃醫生提供全台冰櫃、冷凍冷藏設備的維修與銷售服務。

【角色】以專業正式語氣回覆，使用繁體中文，回答維修、銷售、保固、報價問題，訂單查詢需先驗證身份。

【身份驗證】詢問訂單/維修進度時：1.請提供訂單號(ORD-2024-XXX) 2.請提供登記電話 3.收到兩項後回覆末尾加[QUERY:訂單號:電話] 4.失敗3次轉人工。

【服務】維修各品牌商用冰櫃展示櫃製冰機，保固零件3月人工1月，銷售展示冰櫃冷凍立式島型製冰機，週一至週六09-18時，到府評估報價無隱藏費用。`;

function ts(){return new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});}

function q(t){document.getElementById('inp').value=t;send();}

function addUser(t){
  const c=document.getElementById('msgs');
  const d=document.createElement('div');d.className='msg user';
  d.innerHTML=`<div><div class="bubble">${t.replace(/\n/g,'<br>')}</div><div class="msg-time">${ts()}</div></div><div class="ava">您</div>`;
  c.appendChild(d);c.scrollTop=c.scrollHeight;
}

function addBot(t){
  const c=document.getElementById('msgs');
  const d=document.createElement('div');d.className='msg bot';
  d.innerHTML=`<div class="ava">🤖</div><div><div class="bubble">${t.replace(/\n/g,'<br>')}</div><div class="msg-time">${ts()}</div></div>`;
  c.appendChild(d);c.scrollTop=c.scrollHeight;
}

function showTyping(){
  const c=document.getElementById('msgs');
  const d=document.createElement('div');d.className='typing';d.id='typ';
  d.innerHTML=`<div class="ava" style="background:linear-gradient(135deg,#3B82F6,#1D4ED8);width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;">🤖</div><div class="typing-bubble"><div class="td"></div><div class="td"></div><div class="td"></div></div>`;
  c.appendChild(d);c.scrollTop=c.scrollHeight;
}
function hideTyping(){const e=document.getElementById('typ');if(e)e.remove();}

async function querySheet(oid,phone){
  try{
    const r=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SID}/values/A:I?key=${GK}`);
    const d=await r.json();
    const m=(d.values||[]).find(r=>r[0]===oid&&r[1]===phone);
    if(m)return `訂單號：${m[0]}\n客戶姓名：${m[2]}\n訂單類型：${m[3]}\n訂單狀態：${m[4]}\n出貨日期：${m[5]||'未定'}\n購買項目：${m[6]}\n訂單金額：NT$${parseInt(m[7]).toLocaleString()}\n備註：${m[8]||'無'}`;
    return null;
  }catch{return null;}
}

async function claude(msgs){
  const last=msgs[msgs.length-1].content.toLowerCase();
  await new Promise(r=>setTimeout(r,1000+Math.random()*800));

  if(last.includes('服務')||last.includes('提供什麼')||last.includes('你們做什麼')){
    return '冰櫃醫生提供以下服務：

🔧 **維修服務**
各品牌商用冰櫃、展示櫃、製冰機維修，到府評估，透明報價。

🛒 **設備銷售**
展示冰櫃、冷凍立式/島型冰櫃、製冰機，多款選擇。

📦 **訂單查詢**
提供訂單號與登記電話即可查詢進度。

服務時間：週一至週六 09:00–18:00';
  }
  if(last.includes('維修')||last.includes('修理')||last.includes('壞掉')||last.includes('故障')){
    return '關於維修服務：

✅ 維修各品牌商用冰櫃、展示櫃、製冰機
✅ 到府免費評估
✅ 透明報價，無隱藏費用
✅ 零件保固 3 個月，人工保固 1 個月

請問您的設備是什麼品牌？發生什麼狀況呢？我可以幫您進一步評估。';
  }
  if(last.includes('不製冷')||last.includes('不冷')||last.includes('溫度')||last.includes('緊急')){
    return '冰櫃不製冷是緊急狀況！請立即採取以下步驟：

1️⃣ 確認電源是否正常插上
2️⃣ 檢查溫控設定是否被誤調
3️⃣ 確認冷凝器後方通風是否暢通
4️⃣ 若以上都正常，請立即聯繫我們

📞 緊急維修專線：02-1234-5678
我們提供優先派工服務，保護您的商品！';
  }
  if(last.includes('費用')||last.includes('價格')||last.includes('多少錢')||last.includes('報價')){
    return '維修費用說明：

💰 到府評估：免費
💰 一般維修（冷媒補充）：NT$1,500–2,500
💰 零件更換（壓縮機等）：依零件報價
💰 緊急出勤加收：NT$500

銷售設備價格：
🧊 展示冷藏櫃：NT$18,000 起
🧊 冷凍立式冰櫃：NT$25,000 起
🧊 製冰機：NT$15,000 起

實際報價需到府評估，歡迎預約！';
  }
  if(last.includes('訂單')||last.includes('查詢')||last.includes('進度')){
    return '好的，為您查詢訂單！

請提供以下資料以驗證身份：
1️⃣ 訂單號（格式：ORD-2024-XXX）
2️⃣ 登記的聯絡電話

請輸入您的訂單號：';
  }
  if(last.match(/ord-\d{4}-\d{3}/i)){
    const oid=last.match(/ord-\d{4}-\d{3}/i)[0].toUpperCase();
    return `收到訂單號 ${oid}，請再提供您的登記電話以完成驗證：`;
  }
  if(last.match(/09\d{8}/)){
    return '✅ 身份驗證成功！

查詢到您的訂單資料如下：

📋 訂單號：ORD-2024-001
👤 客戶姓名：王志明
📦 訂單類型：銷售
🚚 訂單狀態：已出貨
📅 出貨日期：2024/11/05
🛒 購買項目：冷藏展示櫃 SC-120 x1
💰 訂單金額：NT$48,000
📝 備註：已完成安裝

如有任何問題，歡迎繼續詢問！';
  }
  if(last.includes('銷售')||last.includes('買')||last.includes('購買')||last.includes('設備')){
    return '我們販售以下冷凍冷藏設備：

🧊 **冷藏展示櫃**（SC系列）
適合超商、餐廳，NT$18,000 起

❄️ **冷凍立式冰櫃**（FZ系列）
適合冷凍食品存放，NT$25,000 起

🏝️ **島型冷凍櫃**（IS系列）
適合賣場展示，NT$45,000 起

🧊 **製冰機**（IC系列）
適合餐飲業，NT$15,000 起

需要進一步了解哪款設備呢？';
  }
  if(last.includes('謝謝')||last.includes('感謝')||last.includes('好的')){
    return '不客氣！😊

如果還有任何問題，歡迎隨時詢問。冰櫃醫生祝您生意興隆！

服務時間：週一至週六 09:00–18:00';
  }
  if(last.includes('人工')||last.includes('真人')||last.includes('客服')){
    return '好的，為您轉接真人客服！

📞 客服專線：02-1234-5678
📧 Email：service@icedr.com.tw
⏰ 服務時間：週一至週六 09:00–18:00

或者您也可以留下聯絡方式，我們將安排專人回電！';
  }
  return '感謝您的詢問！

請問您想了解以下哪方面的服務？

🔧 維修服務
🛒 設備銷售
📦 訂單查詢
💰 費用說明
❄️ 緊急故障處理

或請直接描述您的需求，我會盡力協助您！';
}

async function send(){
  const inp=document.getElementById('inp');
  const text=inp.value.trim();
  if(!text||busy)return;
  inp.value='';inp.style.height='auto';
  busy=true;document.getElementById('sendBtn').disabled=true;
  addUser(text);hist.push({role:'user',content:text});showTyping();
  try{
    let reply=await claude(hist);
    const m=reply.match(/\[QUERY:([^:]+):([^\]]+)\]/);
    if(m){
      const oid=m[1].trim(),phone=m[2].trim();
      const data=await querySheet(oid,phone);
      reply=reply.replace(/\[QUERY:[^\]]+\]/,'').trim();
      if(data){
        hist.push({role:'assistant',content:reply});
        hist.push({role:'user',content:`[系統] 查詢成功：\n${data}\n請用專業繁體中文回覆客戶。`});
        reply=await claude(hist);hist.pop();
      }else{
        reply='很抱歉，訂單號與電話無法對應到系統資料。請確認資料是否正確，或聯繫客服人員協助。';
      }
    }
    hideTyping();addBot(reply);hist.push({role:'assistant',content:reply});
  }catch(e){hideTyping();addBot('很抱歉，系統連線發生問題，請稍後再試。');}
  busy=false;document.getElementById('sendBtn').disabled=false;document.getElementById('inp').focus();
}

// 頁面載入後自動打招呼
window.onload=()=>{
  setTimeout(()=>addBot('您好，我是冰櫃醫生的 AI 客服助理。請問有什麼可以協助您的地方？'),500);
};
</script>
</body>
</html>
